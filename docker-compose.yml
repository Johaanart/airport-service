services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  airport-service:
    build: ./airport-service
    ports:
      - "8001:8001"
    container_name: airport-service

  itinerary-service:
    build: ./itinerary-service
    ports:
      - "8002:8002"
    container_name: itinerary-service
    environment:
      AIRPORT_SERVICE_URL: "http://airport-service:8001"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
    depends_on:
      - airport-service
      - rabbitmq