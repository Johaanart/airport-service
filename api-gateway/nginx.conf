events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logging con Correlation ID si se requiere
    log_format custom '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_correlation_id"';

    access_log /var/log/nginx/access.log custom;

    upstream airport_service {
        server airport-service:8001;
    }

    upstream itinerary_service {
        server itinerary-service:8002;
    }

    upstream frontend_ui {
        server frontend:80;
    }

    server {
        listen 80;

        # Configuración CORS global en el Gateway
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Correlation-ID' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # 1. Ruteo Frontend
        location / {
            proxy_pass http://frontend_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. Ruteo Airport Service
        location /api/v1/airports {
            proxy_pass http://airport_service/airports;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;
        }

        # 3. Ruteo Itinerary Service
        location /api/v1/itineraries {
            proxy_pass http://itinerary_service/itineraries;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;
        }
    }
}